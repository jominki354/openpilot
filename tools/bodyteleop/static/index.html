<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarrotPilot Remote Control</title>
  <link rel="stylesheet" href="/static/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@^3"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment@^2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@^1"></script>
</head>

<body>
  <div id="main">

    <!-- Compact Logo Header -->
    <div class="logo-header">
      <img src="/static/poster.png" alt="CarrotPilot" class="logo-compact">
    </div>

    <!-- Gamepad Status (Primary) -->
    <div class="gamepad-status-card">
      <div class="status-label">Gamepad Connection</div>
      <div id="gamepad-status-main" class="gamepad-status-value disconnected">Connect Your PS5 Controller</div>
    </div>

    <!-- Input Visualization (Most Important) -->
    <div class="control-section-compact">
      <div class="input-viz-mobile">
        <div class="viz-meter-mobile">
          <div class="meter-label-mobile">Accel / Brake</div>
          <div class="meter-bar-mobile">
            <div class="meter-center-line"></div>
            <div id="accel-fill" class="meter-fill-mobile"></div>
          </div>
          <div id="accel-value" class="meter-value-mobile">0.000</div>
        </div>
        <div class="viz-meter-mobile">
          <div class="meter-label-mobile">Steering</div>
          <div class="meter-bar-mobile">
            <div class="meter-center-line"></div>
            <div id="steer-fill" class="meter-fill-mobile"></div>
          </div>
          <div id="steer-value" class="meter-value-mobile">0.000</div>
        </div>
      </div>
    </div>

    <!-- Keyboard Controls (Fallback) -->
    <div class="keyboard-section">
      <div class="keyboard-grid-mobile">
        <div class="keyboard-row">
          <div class="key-mobile" id="key-w">W</div>
        </div>
        <div class="keyboard-row">
          <div class="key-mobile" id="key-a">A</div>
          <div class="key-mobile" id="key-s">S</div>
          <div class="key-mobile" id="key-d">D</div>
        </div>
      </div>
    </div>

    <!-- System Sounds -->
    <div class="sound-controls">
      <button type="button" id="sound-engage" class="btn-mobile btn-success sound">Engage</button>
      <button type="button" id="sound-disengage" class="btn-mobile btn-warning sound">Disengage</button>
      <button type="button" id="sound-error" class="btn-mobile btn-danger sound">Alert</button>
    </div>

    <!-- Secondary Info (Bottom) -->
    <div class="info-footer">
      <div class="info-item">
        <div class="info-label">Device IP</div>
        <div id="device-ip" class="info-value">-</div>
      </div>
      <div class="info-item">
        <div class="info-label">Latency</div>
        <div id="ping-time" class="info-value">-</div>
      </div>
      <div class="info-item">
        <div class="info-label">Branch</div>
        <div id="branch-name" class="info-value">-</div>
      </div>
    </div>

    <!-- Hidden Elements -->
    <audio id="audio" autoplay="true"></audio>
    <video id="video" playsinline autoplay muted loop style="display:none;"></video>

  </div>
  <script src="/static/js/jsmain.js" type="module"></script>
</body>

</html>
