<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarrotPilot Remote Control</title>
  <link rel="stylesheet" href="/static/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@^3"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment@^2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@^1"></script>
</head>

<body>
  <div id="main">

    <!-- Header -->
    <div class="header">
      <div class="logo-section">
        <img src="/static/poster.png" alt="CarrotPilot Logo" class="logo">
        <div>
          <h1 class="title">CarrotPilot Remote</h1>
          <p class="subtitle">Wireless Gamepad Control Interface</p>
        </div>
      </div>
    </div>

    <!-- Status Cards -->
    <div class="status-grid">
      <div class="status-card">
        <div class="status-label">Connection Status</div>
        <div class="status-value loading">Initializing...</div>
      </div>
      <div class="status-card">
        <div class="status-label">Gamepad</div>
        <div id="gamepad-status-value" class="status-value disconnected">Not Connected</div>
      </div>
      <div class="status-card">
        <div class="status-label">Latency</div>
        <div id="ping-time" class="status-value">-</div>
      </div>
      <div class="status-card">
        <div class="status-label">Battery</div>
        <div id="battery" class="status-value">-</div>
      </div>
    </div>

    <!-- Video Feed -->
    <div class="video-container">
      <audio id="audio" autoplay="true"></audio>
      <video id="video" playsinline autoplay muted loop poster="/static/poster.png"></video>
      <div class="video-overlay">
        Camera Feed
      </div>
    </div>

    <!-- Control Section -->
    <div class="control-section">
      <h2 class="section-title">Control Interface</h2>

      <!-- Input Visualization -->
      <div class="input-viz">
        <div class="viz-meter">
          <div class="meter-label">Acceleration / Brake</div>
          <div class="meter-bar">
            <div id="accel-fill" class="meter-fill" style="width: 0%; left: 50%;"></div>
          </div>
          <div id="accel-value" class="meter-value">0.000</div>
        </div>
        <div class="viz-meter">
          <div class="meter-label">Steering</div>
          <div class="meter-bar">
            <div id="steer-fill" class="meter-fill" style="width: 0%; left: 50%;"></div>
          </div>
          <div id="steer-value" class="meter-value">0.000</div>
        </div>
      </div>

      <!-- Keyboard Controls (Fallback) -->
      <div style="text-align: center; margin-bottom: 1rem;">
        <div class="status-label">Keyboard Controls (Fallback)</div>
      </div>
      <div class="keyboard-grid">
        <div class="keyboard-row">
          <div class="key" id="key-w">W</div>
        </div>
        <div class="keyboard-row">
          <div class="key" id="key-a">A</div>
          <div class="key" id="key-s">S</div>
          <div class="key" id="key-d">D</div>
        </div>
      </div>

      <!-- Sound Test Buttons -->
      <div style="margin-top: 2rem; text-align: center;">
        <div class="status-label" style="margin-bottom: 1rem;">System Sounds</div>
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
          <button type="button" id="sound-engage" class="btn btn-success sound">Engage</button>
          <button type="button" id="sound-disengage" class="btn btn-warning sound">Disengage</button>
          <button type="button" id="sound-error" class="btn btn-danger sound">Alert</button>
        </div>
      </div>
    </div>

    <!-- Charts -->
    <div class="control-section">
      <h2 class="section-title">Performance Metrics</h2>
      <div class="input-viz">
        <div>
          <canvas id="chart-ping"></canvas>
        </div>
        <div>
          <canvas id="chart-battery"></canvas>
        </div>
      </div>
    </div>

  </div>
  <script src="/static/js/jsmain.js" type="module"></script>
</body>

</html>
