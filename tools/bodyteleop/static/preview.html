<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarrotPilot Remote Control - Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #141824;
      --bg-tertiary: #1e2330;
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --text-tertiary: #6b7280;
      --border-color: #2d3748;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #141824 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: var(--bg-secondary);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .title {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .status-card {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      border-left: 4px solid var(--accent-primary);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .status-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .status-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      margin-bottom: 0.5rem;
    }

    .status-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .status-value.connected {
      color: var(--accent-green);
    }

    .video-container {
      position: relative;
      margin-bottom: 2rem;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      background: #000;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-placeholder {
      color: var(--text-tertiary);
      font-size: 1.125rem;
    }

    .control-section {
      background: var(--bg-secondary);
      padding: 2rem;
      border-radius: 16px;
      margin-bottom: 2rem;
      box-shadow: var(--shadow-md);
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: '';
      width: 4px;
      height: 24px;
      background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 2px;
    }

    .input-viz {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .viz-meter {
      background: var(--bg-tertiary);
      padding: 1.5rem;
      border-radius: 12px;
    }

    .meter-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      margin-bottom: 0.75rem;
    }

    .meter-bar {
      position: relative;
      height: 32px;
      background: var(--bg-primary);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .meter-center {
      position: absolute;
      left: 50%;
      width: 2px;
      height: 100%;
      background: var(--text-tertiary);
      opacity: 0.3;
    }

    .meter-fill {
      position: absolute;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
      transition: width 0.1s ease-out, left 0.1s ease-out;
      border-radius: 8px;
      width: 25%;
      left: 50%;
    }

    .meter-value {
      font-size: 1.125rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-primary);
      font-family: 'Courier New', monospace;
    }

    .keyboard-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin: 2rem 0;
    }

    .keyboard-row {
      display: flex;
      gap: 0.5rem;
    }

    .key {
      width: 60px;
      height: 60px;
      background: var(--bg-tertiary);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .key:hover {
      background: var(--bg-primary);
      border-color: var(--accent-primary);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: white;
    }

    .btn-success {
      background: var(--accent-green);
    }

    .btn-warning {
      background: var(--accent-orange);
    }

    .btn-danger {
      background: var(--accent-red);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
    }

    @media (max-width: 768px) {
      #main {
        padding: 1rem;
      }

      .input-viz {
        grid-template-columns: 1fr;
      }

      .status-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="main">

    <div class="header">
      <div class="logo-section">
        <div class="logo">🥕</div>
        <div>
          <h1 class="title">CarrotPilot Remote</h1>
          <p class="subtitle">Wireless Gamepad Control Interface</p>
        </div>
      </div>
    </div>

    <div class="status-grid">
      <div class="status-card">
        <div class="status-label">Connection Status</div>
        <div class="status-value connected">Connected</div>
      </div>
      <div class="status-card">
        <div class="status-label">Gamepad</div>
        <div class="status-value connected">Wireless Controller</div>
      </div>
      <div class="status-card">
        <div class="status-label">Latency</div>
        <div class="status-value">24ms</div>
      </div>
      <div class="status-card">
        <div class="status-label">Battery</div>
        <div class="status-value">87%</div>
      </div>
    </div>

    <div class="video-container">
      <div class="video-placeholder">Camera Feed (WebRTC Connection Required)</div>
    </div>

    <div class="control-section">
      <h2 class="section-title">Control Interface</h2>

      <div class="input-viz">
        <div class="viz-meter">
          <div class="meter-label">Acceleration / Brake</div>
          <div class="meter-bar">
            <div class="meter-center"></div>
            <div class="meter-fill"
              style="width: 25%; left: 50%; background: linear-gradient(90deg, #10b981, #059669);"></div>
          </div>
          <div class="meter-value">0.450</div>
        </div>
        <div class="viz-meter">
          <div class="meter-label">Steering</div>
          <div class="meter-bar">
            <div class="meter-center"></div>
            <div class="meter-fill"
              style="width: 15%; left: 35%; background: linear-gradient(90deg, #8b5cf6, #6366f1);"></div>
          </div>
          <div class="meter-value">-0.320</div>
        </div>
      </div>

      <div style="text-align: center; margin-bottom: 1rem;">
        <div class="status-label">Keyboard Controls (Fallback)</div>
      </div>
      <div class="keyboard-grid">
        <div class="keyboard-row">
          <div class="key">W</div>
        </div>
        <div class="keyboard-row">
          <div class="key">A</div>
          <div class="key">S</div>
          <div class="key">D</div>
        </div>
      </div>

      <div style="margin-top: 2rem; text-align: center;">
        <div class="status-label" style="margin-bottom: 1rem;">System Sounds</div>
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
          <button type="button" class="btn btn-success">Engage</button>
          <button type="button" class="btn btn-warning">Disengage</button>
          <button type="button" class="btn btn-danger">Alert</button>
        </div>
      </div>
    </div>

  </div>
</body>

</html>
