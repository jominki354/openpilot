<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarrotPilot Remote - Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #141824;
      --bg-tertiary: #1e2330;
      --accent-primary: #6366f1;
      --accent-secondary: #8b5cf6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --text-tertiary: #6b7280;
      --border-color: #2d3748;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #141824 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    #main {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
      padding-bottom: 2rem;
    }

    .logo-header {
      text-align: center;
      padding: 1.5rem 0;
    }

    .logo-compact {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #f97316, #f59e0b);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      filter: drop-shadow(0 4px 12px rgba(249, 115, 22, 0.4));
    }

    .gamepad-status-card {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
      text-align: center;
      border: 2px solid var(--border-color);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .status-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
    }

    .gamepad-status-value {
      font-size: 1.125rem;
      font-weight: 600;
      margin-top: 0.5rem;
      padding: 0.75rem;
      background: var(--bg-tertiary);
      border-radius: 8px;
    }

    .gamepad-status-value.connected {
      color: var(--accent-green);
      border: 2px solid var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
    }

    .control-section-compact {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .input-viz-mobile {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .viz-meter-mobile {
      width: 100%;
    }

    .meter-label-mobile {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      margin-bottom: 0.75rem;
      text-align: center;
    }

    .meter-bar-mobile {
      position: relative;
      height: 48px;
      background: var(--bg-primary);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 0.75rem;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .meter-center-line {
      position: absolute;
      left: 50%;
      width: 2px;
      height: 100%;
      background: var(--text-tertiary);
      opacity: 0.3;
      z-index: 1;
    }

    .meter-fill-mobile {
      position: absolute;
      height: 100%;
      border-radius: 12px;
    }

    .meter-value-mobile {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-primary);
      font-family: 'Courier New', monospace;
      background: var(--bg-tertiary);
      padding: 0.5rem;
      border-radius: 8px;
    }

    .keyboard-section {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: 16px;
      margin-bottom: 1.5rem;
    }

    .keyboard-grid-mobile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .keyboard-row {
      display: flex;
      gap: 0.75rem;
    }

    .key-mobile {
      width: 70px;
      height: 70px;
      background: var(--bg-tertiary);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .sound-controls {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .btn-mobile {
      flex: 1;
      padding: 1rem;
      border-radius: 12px;
      border: none;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .btn-success {
      background: var(--accent-green);
    }

    .btn-warning {
      background: var(--accent-orange);
    }

    .btn-danger {
      background: var(--accent-red);
    }

    .info-footer {
      display: flex;
      gap: 0.75rem;
      background: var(--bg-secondary);
      padding: 1rem;
      border-radius: 12px;
    }

    .info-item {
      flex: 1;
      text-align: center;
    }

    .info-label {
      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-tertiary);
      margin-bottom: 0.25rem;
    }

    .info-value {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
      font-family: 'Courier New', monospace;
    }

    @media (min-width: 769px) {
      #main {
        max-width: 800px;
        padding: 2rem;
      }

      .logo-compact {
        width: 100px;
        height: 100px;
      }

      .input-viz-mobile {
        flex-direction: row;
        gap: 2rem;
      }

      .viz-meter-mobile {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <div id="main">

    <div class="logo-header">
      <div class="logo-compact">🦌</div>
    </div>

    <div class="gamepad-status-card">
      <div class="status-label">Gamepad Connection</div>
      <div class="gamepad-status-value connected">Wireless Controller</div>
    </div>

    <div class="control-section-compact">
      <div class="input-viz-mobile">
        <div class="viz-meter-mobile">
          <div class="meter-label-mobile">Accel / Brake</div>
          <div class="meter-bar-mobile">
            <div class="meter-center-line"></div>
            <div class="meter-fill-mobile"
              style="width: 30%; left: 50%; background: linear-gradient(90deg, #10b981, #059669);"></div>
          </div>
          <div class="meter-value-mobile">0.620</div>
        </div>
        <div class="viz-meter-mobile">
          <div class="meter-label-mobile">Steering</div>
          <div class="meter-bar-mobile">
            <div class="meter-center-line"></div>
            <div class="meter-fill-mobile"
              style="width: 18%; left: 32%; background: linear-gradient(90deg, #8b5cf6, #6366f1);"></div>
          </div>
          <div class="meter-value-mobile">-0.380</div>
        </div>
      </div>
    </div>

    <div class="keyboard-section">
      <div class="keyboard-grid-mobile">
        <div class="keyboard-row">
          <div class="key-mobile">W</div>
        </div>
        <div class="keyboard-row">
          <div class="key-mobile">A</div>
          <div class="key-mobile">S</div>
          <div class="key-mobile">D</div>
        </div>
      </div>
    </div>

    <div class="sound-controls">
      <button type="button" class="btn-mobile btn-success">Engage</button>
      <button type="button" class="btn-mobile btn-warning">Disengage</button>
      <button type="button" class="btn-mobile btn-danger">Alert</button>
    </div>

    <div class="info-footer">
      <div class="info-item">
        <div class="info-label">Device IP</div>
        <div class="info-value">192.168.43.1</div>
      </div>
      <div class="info-item">
        <div class="info-label">Latency</div>
        <div class="info-value">18ms</div>
      </div>
      <div class="info-item">
        <div class="info-label">Battery</div>
        <div class="info-value">91%</div>
      </div>
    </div>

  </div>
</body>

</html>
